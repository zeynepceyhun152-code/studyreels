<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyReels AI Pro - Clean Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 m-0 p-0 overflow-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Minimal line-icon set (stroke-based, IG-style visual language) — original paths, no copied assets.
        const ICON_PATHS = {
          heart: ["M12 21s-8.2-4.9-11-9.7C-.6 7.6 1.6 3.5 5.4 3c2.3-.3 4.4.9 5.6 2.8C12.2 3.9 14.3 2.7 16.6 3c3.8.5 6 4.6 4.4 8.3C18.2 16.1 12 21 12 21z"],
          bookmark: ["M6 3h12v18l-6-4.2L6 21V3z"],
          document: ["M6 2h8l5 5v15H6V2z", "M14 2v5h5"],
          send: ["M2 11l19-9-6 19-4-7-7-3z", "M15 3L8 13"],
          shield: ["M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5l8-3z"],
          chevronUp: ["M6 15l6-6 6 6"],
          chevronDown: ["M6 9l6 6 6-6"],
          house: ["M3 11l9-8 9 8", "M5 10v10h5v-6h4v6h5V10"],
          film: ["M3 5h18v14H3z", "M3 9h18", "M3 15h18", "M8 5v4", "M8 15v4", "M16 5v4", "M16 15v4"],
          users: ["M8 11a3 3 0 100-6 3 3 0 000 6z", "M16 11a3 3 0 100-6 3 3 0 000 6z", "M2 20c0-3.3 3-5.5 6-5.5s6 2.2 6 5.5", "M13 14.8c2.6.3 5 2.4 5 5.2"],
          chat: ["M21 11.5a8.4 8.4 0 01-8.9 8.4 8.9 8.9 0 01-3.4-.7L3 21l1.8-5.5A8.4 8.4 0 1121 11.5z"],
          userCircle: ["M12 12a4 4 0 100-8 4 4 0 000 8z", "M4 20c0-4 4-6 8-6s8 2 8 6"],
          x: ["M6 6l12 12", "M18 6L6 18"]
        };

        const Icon = ({ name, filled = false, size = 22, className = "" }) => (
          <svg
            width={size} height={size} viewBox="0 0 24 24"
            fill={filled ? "currentColor" : "none"}
            stroke="currentColor" strokeWidth={filled ? "0" : "1.8"}
            strokeLinecap="round" strokeLinejoin="round"
            className={className}
          >
            {ICON_PATHS[name].map((d, i) => <path key={i} d={d} />)}
          </svg>
        );

        // Expanded reel pool showcasing ALL 3 distinct types (POV, AI Footage, Avatar) with rich gradient backgrounds
        const INITIAL_REELS = [
          {
            id: 1,
            type: "pov",
            topic: "Calculus Final Prep",
            script: "POV: You thought derivatives were hard until your professor explained them like a car speedometer.",
            description: "A derivative tells you how fast something is changing at one exact moment. Just like a speedometer shows your speed at a single instant (not your average speed for the whole trip), a derivative shows the instantaneous rate of change of a function at one specific point on its curve.",
            sourceQuote: "Derivatives measure instantaneous rate of change.",
            bgGradient: "bg-gradient-to-tr from-rose-500 via-pink-500 to-amber-400 text-white shadow-xl",
            quiz: { question: "What does instantaneous rate of change correspond to?", options: ["Total mileage", "Speedometer reading at 1 sec", "Gas capacity", "Tire pressure"], correctIndex: 1 },
            semanticTags: ["Math", "STEM", "POV"]
          },
          {
            id: 2,
            type: "ai_footage",
            topic: "AP Biology - Mitochondria",
            script: "Inside your cellular matrix: glucose molecules are shredded into high-energy ATP packets.",
            description: "Cellular respiration is how cells convert food into usable energy. Glucose is broken down step by step, mostly inside the mitochondria, and the energy released is captured in molecules of ATP — the cell's main energy currency, used to power nearly everything the cell does.",
            sourceQuote: "Cellular respiration breaks down glucose to generate ATP.",
            bgGradient: "bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900 text-white shadow-xl",
            quiz: { question: "Where does this primary energy extraction happen?", options: ["Nucleus", "Ribosome", "Mitochondria", "Cell Wall"], correctIndex: 2 },
            semanticTags: ["Biology", "STEM", "AI Footage"]
          },
          {
            id: 3,
            type: "avatar",
            topic: "World History - Cold War",
            script: "Professor Maya here! Remember, the Cold War wasn't just fought with tanks; it was fought through economic aid and proxy flashpoints.",
            description: "The Cold War (1947-1991) was a rivalry between the US and USSR that rarely involved direct combat between the two powers. Instead, it played out through proxy wars in other countries, economic aid used to win allies, an arms race, and propaganda — a conflict fought through influence rather than open battle.",
            sourceQuote: "Geopolitical rivalry post-WWII manifested in proxy conflicts.",
            bgGradient: "bg-gradient-to-tr from-indigo-600 via-blue-600 to-slate-900 text-white shadow-xl",
            quiz: { question: "Main conflict mechanism described?", options: ["Total nuclear war", "Proxy conflicts & economic aid", "Naval blockades only", "Peace treaties"], correctIndex: 1 },
            semanticTags: ["Humanities", "Avatar-Led"]
          },
          {
            id: 4,
            type: "pov",
            topic: "Quantum Physics",
            script: "POV: You realize electrons can be in two places at once until someone looks at them.",
            description: "Quantum superposition means a particle like an electron doesn't have one fixed state until it's measured — it exists as a combination of multiple possible states at once. The act of measuring it is what forces it to 'choose' one definite outcome.",
            sourceQuote: "Quantum superposition allows particles to exist in multiple states simultaneously.",
            bgGradient: "bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-800 text-white shadow-xl",
            quiz: { question: "What phenomenon explains this?", options: ["Gravity", "Superposition", "Friction", "Inertia"], correctIndex: 1 },
            semanticTags: ["STEM", "POV"]
          },
          {
            id: 5,
            type: "ai_footage",
            topic: "Cellular Respiration Explained",
            videoUrl: "/videos/cellular_respiration.mp4",
            description: "Cellular respiration converts glucose into usable energy in three stages: glycolysis in the cytoplasm, the Krebs cycle in the mitochondria, and the electron transport chain, which produces the bulk of the cell's ATP — roughly 36 molecules from a single glucose molecule.",
            sourceQuote: "Glycolysis, the Krebs cycle, and the electron transport chain together convert glucose into ATP.",
            bgGradient: "bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900 text-white shadow-xl",
            quiz: { question: "Which stage produces the majority of a cell's ATP?", options: ["Electron transport chain", "Glycolysis", "Krebs cycle", "Fermentation"], correctIndex: 0 },
            semanticTags: ["Biology", "STEM", "AI Footage"]
          }
        ];

        function StudyReelsApp() {
          const [authView, setAuthView] = useState("welcome");
          const [currentUser, setUser] = useState(null);
          
          const [usernameInput, setUsername] = useState("");
          const [passwordInput, setPassword] = useState("");
          const [nameInput, setNameInput] = useState("");
          const [gradeInput, setGradeInput] = useState("");
          const [currInput, setCurrInput] = useState("");
          const [signupClassList, setSignupClassList] = useState("");
          const [signupBio, setSignupBio] = useState("");
          const [signupPic, setSignupPic] = useState(null);
          const [signupStep, setSignupStep] = useState(1);

          const [activeTab, setActiveTab] = useState("workspace");
          
          const [editName, setEditName] = useState("");
          const [editGrade, setEditGrade] = useState("");
          const [editCurr, setEditCurr] = useState("");
          const [editClassList, setEditClassList] = useState("");
          const [editBio, setEditBio] = useState("");
          const [editPic, setEditPic] = useState(null);

          const [notes, setNotes] = useState([
            { id: 101, title: "Calculus Limits & Slopes", content: "Derivatives represent the instantaneous slope of a tangent line." },
            { id: 102, title: "Cellular Respiration", content: "Mitochondria convert glucose and oxygen into ATP packets." }
          ]);
          const [noteTitle, setNoteTitle] = useState("");
          const [noteContent, setNoteContent] = useState("");
          const [isGenerating, setIsGenerating] = useState(false);
          const [generateError, setGenerateError] = useState(null);

          const [reelsPool, setReelsPool] = useState([]);
          const [selectedTagFilter, setSelectedTagFilter] = useState("All");
          const [likedReels, setLikedReels] = useState([]);
          const [currentIndex, setCurrentIndex] = useState(0);

          // Friends / Study Buddy state
          const [friends, setFriends] = useState([]);
          const [incomingRequests, setIncomingRequests] = useState([]);
          const [sentRequests, setSentRequests] = useState([]);
          const [buddySuggestions, setBuddySuggestions] = useState([]);
          const [friendSearchQuery, setFriendSearchQuery] = useState("");
          const [friendSearchResults, setFriendSearchResults] = useState([]);
          const [sharedInbox, setSharedInbox] = useState([]);
          const [showShareModal, setShowShareModal] = useState(false);
          const [shareStatus, setShareStatus] = useState(null);
          const [viewingFriend, setViewingFriend] = useState(null);

          // Study Buddy AI chat state
          const [studyBuddyMessages, setStudyBuddyMessages] = useState([]);
          const [studyBuddyInput, setStudyBuddyInput] = useState("");
          const [studyBuddyLoading, setStudyBuddyLoading] = useState(false);

          // Dark mode
          const [darkMode, setDarkMode] = useState(false);
          useEffect(() => {
            document.documentElement.classList.toggle('dark', darkMode);
          }, [darkMode]);

          // Common classes (tick-to-preload demo reels) + tag filter menu
          const COMMON_CLASSES = [
            { key: "Math", label: "📐 Math" },
            { key: "Biology", label: "🧬 Biology" },
            { key: "Humanities", label: "📜 Humanities" },
            { key: "STEM", label: "⚛️ Science" }
          ];
          const [signupCommonClasses, setSignupCommonClasses] = useState([]);
          const [editCommonClasses, setEditCommonClasses] = useState([]);
          const [showTagFilterMenu, setShowTagFilterMenu] = useState(false);

          const toggleClassPick = (key, list, setList) => {
            setList(list.includes(key) ? list.filter(k => k !== key) : [...list, key]);
          };

          const EMOJI_AVATARS = ["🙂", "😎", "🤓", "🦉", "🐱", "🐼", "🚀", "🌟", "🎓", "📚"];

          const Avatar = ({ pic, size = "w-8 h-8" }) => (
            <div className={`${size} rounded-full bg-slate-200 dark:bg-slate-600 border border-slate-300 dark:border-slate-500 flex items-center justify-center overflow-hidden shrink-0`}>
              {pic
                ? (pic.startsWith('data:') ? <img src={pic} alt="" className="w-full h-full object-cover" /> : <span className="text-base leading-none">{pic}</span>)
                : <span className="text-xs">🙂</span>}
            </div>
          );

          // Modals & Quizzes
          const [showSource, setShowSource] = useState(false);
          const [showExplain, setShowExplain] = useState(false);
          const [showTrust, setShowTrust] = useState(false);
          const [showQuiz, setShowQuiz] = useState(false);
          const [quizReel, setQuizReel] = useState(null);
          const [quizSelected, setQuizSelected] = useState(null);
          const [quizSubmitted, setQuizSubmitted] = useState(false);

          const [authError, setAuthError] = useState(null);

          const readFileAsDataUrl = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });

          const handlePicSelect = async (e, setter) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
              const dataUrl = await readFileAsDataUrl(file);
              setter(dataUrl);
            } catch (err) {
              console.error("Couldn't read image:", err.message);
            }
          };

          const isDefaultReel = (r) => INITIAL_REELS.some(ir => ir.id === r.id);

          const rebuildReelsPool = (user) => {
            setReelsPool(prev => {
              const custom = prev.filter(r => !isDefaultReel(r));
              const classes = (user && user.commonClasses) || [];
              const defaults = classes.length > 0 ? INITIAL_REELS.filter(r => r.semanticTags.some(t => classes.includes(t))) : [];
              return [...custom, ...defaults];
            });
          };

          const handleAuthSubmit = async (e, isSignUp) => {
            e.preventDefault();
            setAuthError(null);
            const endpoint = isSignUp ? '/api/auth/signup' : '/api/auth/signin';
            const payload = isSignUp
              ? { username: usernameInput, password: passwordInput, name: nameInput, grade: gradeInput, curriculum: currInput, classList: signupClassList, bio: signupBio, profilePic: signupPic, commonClasses: signupCommonClasses }
              : { username: usernameInput, password: passwordInput };

            try {
              const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              const data = await res.json();
              if (!res.ok || !data.success) {
                throw new Error(data.error || 'Authentication failed');
              }
              setUser(data.user);
              setEditName(data.user.name || "");
              setEditGrade(data.user.grade || "");
              setEditCurr(data.user.curriculum || "");
              setEditClassList(data.user.classList || "");
              setEditBio(data.user.bio || "");
              setEditPic(data.user.profilePic || null);
              setEditCommonClasses(data.user.commonClasses || []);
              setLikedReels(data.user.likedReels || []);
              rebuildReelsPool(data.user);
              setSignupStep(1);
              setAuthView("app");
            } catch (err) {
              setAuthError(err.message);
            }
          };

          const handleUpdateProfile = async (e) => {
            e.preventDefault();
            try {
              const res = await fetch('/api/user/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, name: editName, grade: editGrade, curriculum: editCurr, classList: editClassList, bio: editBio, profilePic: editPic, commonClasses: editCommonClasses })
              });
              const data = await res.json();
              if (!res.ok || !data.success) throw new Error(data.error || 'Update failed');
              setUser(data.user);
              rebuildReelsPool(data.user);
              alert("Profile saved!");
            } catch (err) {
              alert("Couldn't save profile: " + err.message);
            }
          };

          const handleLikeReel = async (reel) => {
            const alreadyLiked = likedReels.some(r => r.id === reel.id);
            setLikedReels(alreadyLiked ? likedReels.filter(r => r.id !== reel.id) : [...likedReels, reel]);

            if (!currentUser) return;
            try {
              const res = await fetch('/api/user/like', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, reel })
              });
              const data = await res.json();
              if (res.ok && data.success) setLikedReels(data.likedReels);
            } catch (err) {
              console.error("Like sync failed (kept local):", err.message);
            }
          };

          const justGeneratedIdRef = useRef(null);

          const handleUploadNotes = async (e) => {
            e.preventDefault();
            if (!noteTitle || !noteContent) return;
            setIsGenerating(true);
            setGenerateError(null);

            try {
              const res = await fetch('/api/ai/generate-reel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: noteTitle, content: noteContent })
              });
              const data = await res.json();
              if (!res.ok || !data.success) {
                throw new Error(data.error || 'Reel generation failed');
              }

              justGeneratedIdRef.current = data.reel.id;
              setReelsPool([data.reel, ...reelsPool]);
              setNotes([{ id: Date.now(), title: noteTitle, content: noteContent }, ...notes]);
              setNoteTitle("");
              setNoteContent("");
              setCurrentIndex(0);
              setActiveTab("reels");
            } catch (err) {
              console.error(err);
              setGenerateError("Couldn't reach the AI backend — is the server running? (" + err.message + ")");
            } finally {
              setIsGenerating(false);
            }
          };

          // ── Friends / Study Buddy handlers ─────────────────────────────
          const fetchFriendsData = async () => {
            if (!currentUser) return;
            try {
              const res = await fetch('/api/friends/list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username })
              });
              const data = await res.json();
              if (data.success) {
                setFriends(data.friends);
                setIncomingRequests(data.incomingRequests);
                setSentRequests(data.sentRequests);
              }
            } catch (err) { console.error("Friends fetch failed:", err.message); }
          };

          const fetchBuddySuggestions = async () => {
            if (!currentUser) return;
            try {
              const res = await fetch('/api/friends/suggest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username })
              });
              const data = await res.json();
              if (data.success) setBuddySuggestions(data.suggestions);
            } catch (err) { console.error("Buddy suggest failed:", err.message); }
          };

          const fetchSharedInbox = async () => {
            if (!currentUser) return;
            try {
              const res = await fetch('/api/reels/inbox', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username })
              });
              const data = await res.json();
              if (data.success) setSharedInbox(data.inbox);
            } catch (err) { console.error("Inbox fetch failed:", err.message); }
          };

          const handleFriendSearch = async (e) => {
            e.preventDefault();
            if (!friendSearchQuery.trim()) { setFriendSearchResults([]); return; }
            try {
              const res = await fetch('/api/users/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, query: friendSearchQuery })
              });
              const data = await res.json();
              if (data.success) setFriendSearchResults(data.users);
            } catch (err) { console.error("Search failed:", err.message); }
          };

          const sendFriendRequest = async (toUsername) => {
            try {
              const res = await fetch('/api/friends/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fromUsername: currentUser.username, toUsername })
              });
              const data = await res.json();
              if (data.success) {
                fetchFriendsData();
                fetchBuddySuggestions();
                handleFriendSearch({ preventDefault: () => {} });
              }
            } catch (err) { console.error("Request failed:", err.message); }
          };

          const respondFriendRequest = async (fromUsername, accept) => {
            try {
              const res = await fetch('/api/friends/respond', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, fromUsername, accept })
              });
              const data = await res.json();
              if (data.success) fetchFriendsData();
            } catch (err) { console.error("Respond failed:", err.message); }
          };

          const shareReelWithFriend = async (toUsername) => {
            setShareStatus(null);
            try {
              const res = await fetch('/api/reels/share', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fromUsername: currentUser.username, toUsername, reel: activeReel })
              });
              const data = await res.json();
              if (!res.ok || !data.success) throw new Error(data.error || "Send failed");
              setShareStatus(`Sent to ${toUsername}!`);
            } catch (err) {
              setShareStatus(err.message);
            }
          };

          const sendStudyBuddyMessage = async (e) => {
            e.preventDefault();
            const text = studyBuddyInput.trim();
            if (!text) return;
            const newHistory = [...studyBuddyMessages, { role: "user", content: text }];
            setStudyBuddyMessages(newHistory);
            setStudyBuddyInput("");
            setStudyBuddyLoading(true);
            try {
              const res = await fetch('/api/ai/study-buddy-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ history: newHistory.map(m => ({ role: m.role, content: m.content })) })
              });
              const data = await res.json();
              setStudyBuddyMessages([...newHistory, { role: "assistant", content: data.reply || "Sorry, I couldn't respond." }]);
            } catch (err) {
              setStudyBuddyMessages([...newHistory, { role: "assistant", content: "Couldn't reach the AI backend — is the server running?" }]);
            } finally {
              setStudyBuddyLoading(false);
            }
          };

          useEffect(() => {
            if (activeTab === "friends" && currentUser) {
              fetchFriendsData();
              fetchBuddySuggestions();
              fetchSharedInbox();
            }
          }, [activeTab]);

          const filteredReels = selectedTagFilter === "All" 
            ? reelsPool 
            : reelsPool.filter(r => r.semanticTags && r.semanticTags.includes(selectedTagFilter));

          const activeReel = filteredReels[currentIndex] || filteredReels[0] || reelsPool[0];

          // ── Activity logging + personalized ranking ──────────────────
          const userRef = useRef(currentUser);
          useEffect(() => { userRef.current = currentUser; }, [currentUser]);

          const likedIdsRef = useRef([]);
          useEffect(() => { likedIdsRef.current = likedReels.map(r => r.id); }, [likedReels]);

          const lastQuizResultRef = useRef(null);
          const viewStartRef = useRef(Date.now());
          const [isPersonalized, setIsPersonalized] = useState(false);

          const logActivity = (reel, watchSeconds) => {
            const user = userRef.current;
            if (!user || !reel) return;
            const subject = (reel.semanticTags && reel.semanticTags[0]) || "STEM";
            const quizResult = lastQuizResultRef.current;
            const quizCorrect = quizResult && quizResult.reelId === reel.id ? quizResult.correct : false;
            fetch('/api/activity/log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: user.username,
                reelId: reel.id,
                subject,
                type: reel.type,
                watchSeconds,
                liked: likedIdsRef.current.includes(reel.id),
                quizCorrect
              })
            }).catch(err => console.error("Activity log failed:", err.message));
          };

          // Log watch time for a reel when the student scrolls away from it (or leaves the app)
          useEffect(() => {
            viewStartRef.current = Date.now();
            const reelAtMount = activeReel;
            return () => {
              if (reelAtMount) {
                const watched = (Date.now() - viewStartRef.current) / 1000;
                logActivity(reelAtMount, watched);
              }
            };
          }, [activeReel?.id]);

          const jumpToReelIdRef = useRef(null);

          const fetchPersonalizedFeed = async () => {
            const user = userRef.current;
            if (!user || reelsPool.length === 0) return;
            try {
              const res = await fetch('/api/ai/recommend-feed', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user.username, reels: reelsPool })
              });
              const data = await res.json();
              if (res.ok && data.success) {
                let ranked = data.reels;
                const pinnedId = justGeneratedIdRef.current;
                if (pinnedId !== null) {
                  const pinnedIdx = ranked.findIndex(r => r.id === pinnedId);
                  if (pinnedIdx > 0) {
                    const [pinned] = ranked.splice(pinnedIdx, 1);
                    ranked = [pinned, ...ranked];
                  }
                  justGeneratedIdRef.current = null;
                }
                setReelsPool(ranked);
                setIsPersonalized(data.personalized);

                const jumpId = jumpToReelIdRef.current;
                if (jumpId !== null) {
                  const jumpIdx = ranked.findIndex(r => r.id === jumpId);
                  setCurrentIndex(jumpIdx !== -1 ? jumpIdx : 0);
                  jumpToReelIdRef.current = null;
                } else {
                  setCurrentIndex(0);
                }
              }
            } catch (err) {
              console.error("Personalized feed fetch failed:", err.message);
            }
          };

          useEffect(() => {
            if (activeTab === "reels") fetchPersonalizedFeed();
          }, [activeTab]);

          const prevReelRef = useRef(null);
          useEffect(() => {
            const leftReel = prevReelRef.current;
            // Same cadence as before (every 2 reels), but the quiz now tests the reel the student
            // just scrolled AWAY from — which they've actually seen — not the one they just arrived at.
            if (currentIndex > 0 && currentIndex % 2 === 0 && leftReel && leftReel.quiz) {

                      )}
                    </div>
                  )}

                  {activeTab === "profile" && (
                    <div className="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 space-y-3">
                      <h3 className="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider">Student Profile & Class List</h3>
                      <form onSubmit={handleUpdateProfile} className="space-y-2.5 text-xs">
                        <div>
                          <div className="flex items-center gap-3 mb-2">
                            <Avatar pic={editPic} size="w-14 h-14" />
                            <div>
                              <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Profile Picture:</label>
                              <input type="file" accept="image/*" onChange={e => handlePicSelect(e, setEditPic)} className="text-[10px] text-slate-500 dark:text-slate-400" />
                            </div>
                          </div>
                          <p className="text-[10px] text-slate-400 dark:text-slate-500 mb-1">...or just pick an emoji:</p>
                          <div className="flex flex-wrap gap-1.5">
                            {EMOJI_AVATARS.map(em => (
                              <button type="button" key={em} onClick={() => setEditPic(em)} className={`w-8 h-8 rounded-full flex items-center justify-center text-base border transition-all ${editPic === em ? "border-blue-600 bg-blue-50 dark:bg-blue-950" : "border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600"}`}>{em}</button>
                            ))}
                          </div>
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Full Name:</label>
                          <input type="text" value={editName} onChange={e => setEditName(e.target.value)} className="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-slate-900 dark:text-slate-100" />
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Grade Level:</label>
                          <input type="text" value={editGrade} onChange={e => setEditGrade(e.target.value)} className="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-slate-900 dark:text-slate-100" />
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Curriculum Board:</label>
                          <input type="text" value={editCurr} onChange={e => setEditCurr(e.target.value)} className="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-slate-900 dark:text-slate-100" />
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Class List:</label>
                          <input type="text" value={editClassList} onChange={e => setEditClassList(e.target.value)} className="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-slate-900 dark:text-slate-100" />
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Default Classes (preloads demo reels in your feed):</label>
                          <div className="flex flex-wrap gap-2">
                            {COMMON_CLASSES.map(c => (
                              <button type="button" key={c.key} onClick={() => toggleClassPick(c.key, editCommonClasses, setEditCommonClasses)}
                                className={`px-3 py-1.5 rounded-full text-[11px] font-semibold border transition-all ${editCommonClasses.includes(c.key) ? "bg-blue-600 border-blue-600 text-white" : "bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300"}`}>
                                {c.label}
                              </button>
                            ))}
                          </div>
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-500 dark:text-slate-400 block mb-1">Bio:</label>
                          <textarea rows="2" value={editBio} onChange={e => setEditBio(e.target.value)} className="w-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg p-2 text-slate-900 dark:text-slate-100 resize-none" />
                        </div>
                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg font-bold text-white transition-all shadow-sm mt-1">Save Changes</button>
                      </form>
                    </div>
                  )}
                  </div>
                  <div className="text-[10px] text-slate-400 dark:text-slate-500 text-center pt-6">StudyReels</div>
                </div>
              )}
              </div>

              {/* Friend Profile Viewer */}
              {viewingFriend && (
                <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-6" onClick={() => setViewingFriend(null)}>
                  <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 w-full max-w-sm text-left shadow-lg text-slate-900 dark:text-slate-100" onClick={e => e.stopPropagation()}>
                    <div className="flex items-center gap-3 mb-4">
                      <Avatar pic={viewingFriend.profilePic} size="w-14 h-14" />
                      <div>
                        <h3 className="text-sm font-bold">{viewingFriend.name}</h3>
                        <p className="text-[11px] text-blue-600 dark:text-blue-400">{viewingFriend.grade} • {viewingFriend.curriculum}</p>
                      </div>
                    </div>
                    <div className="space-y-3">
                      <div>
                        <span className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">Classes</span>
                        <p className="text-xs text-slate-700 dark:text-slate-300">{viewingFriend.classList || "Not listed yet"}</p>
                      </div>
                      <div>
                        <span className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">Bio</span>
                        <p className="text-xs text-slate-700 dark:text-slate-300">{viewingFriend.bio || "No bio yet"}</p>
                      </div>
                    </div>
                    <button onClick={() => setViewingFriend(null)} className="w-full bg-slate-900 hover:bg-slate-800 py-2 rounded-xl text-xs font-bold text-white transition-all shadow-sm mt-5">Close</button>
                  </div>
                </div>
              )}

              <BottomNav />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<StudyReelsApp />);
    </script>
</body>
</html>
